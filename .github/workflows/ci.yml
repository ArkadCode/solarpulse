name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never calls the API or needs Docker: storage is a local folder and
  # Bronze is filled with synthetic data.
  SOLARPULSE_STORAGE_BACKEND: local
  GX_ANALYTICS_ENABLED: "False"

jobs:
  lint-and-test:
    name: Lint and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r dashboard/requirements.txt
      - name: Lint
        run: ruff check src tests airflow benchmarks dashboard
      - name: Unit and end-to-end tests
        run: pytest -q

  dbt-build:
    name: dbt build on sample data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate synthetic Bronze
        run: python -m src.ingestion.incremental_loader --synthetic --start-date 2023-01-01 --end-date 2024-12-31
      - name: dbt build (models + tests)
        run: python -m src.transform.dbt_runner build
      - name: Great Expectations report
        run: python -m src.quality.run_quality
      - name: SRS sensitivity and external validation
        run: |
          python -m src.scoring.sensitivity
          python -m src.scoring.validation
      - name: Publish layers to the lake
        run: python -m src.lake.publish
      - name: dbt docs (lineage)
        run: python -m src.transform.dbt_runner docs generate
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quality-report-and-dbt-docs
          path: |
            reports/
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json

  airflow-dags:
    name: Airflow DAGs load
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow-ci
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Airflow with official constraints
        run: |
          pip install "apache-airflow==3.3.2" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"
      - name: Create a throwaway Airflow metadata database
        # Airflow 3 reads its metadata DB while loading DAGs; SQLite is enough here.
        run: airflow db migrate
      - name: Import every DAG
        run: pytest -q tests/test_dags.py

  docker-compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - name: Build images
        run: docker compose build
