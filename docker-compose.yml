# The whole environment with one command: `make up`.
#
#   object-store   S3-compatible lake (RustFS)        http://localhost:9001
#   airflow-*      Airflow 3 with LocalExecutor        http://localhost:8080
#   dashboard      Streamlit, reads the published lake http://localhost:8501
#   mlflow         MLflow tracking server + registry   http://localhost:5001
#   postgres       Airflow metadata database
#
# RustFS is an open-source (Apache-2.0), S3-compatible object store and a drop-in
# replacement for MinIO, which no longer publishes container images.

x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: solarpulse-airflow:3.3.2
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"  # make trigger runs right away
    AIRFLOW__CORE__DAGS_FOLDER: /opt/solarpulse/airflow/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"  # local only: no login
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-solarpulse-local-jwt-secret}
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    # Pipeline settings: the same variables the code reads on the host.
    SOLARPULSE_PROJECT_DIR: /opt/solarpulse
    SOLARPULSE_STORAGE_BACKEND: s3
    S3_ENDPOINT: object-store:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-solarpulse}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-solarpulse-secret}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - .:/opt/solarpulse
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    object-store:
      condition: service_started

services:
  object-store:
    image: rustfs/rustfs:1.0.3
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-solarpulse}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-solarpulse-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - lake_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow pools set duckdb_warehouse 1 "Single writer for the DuckDB warehouse"
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      retries: 10
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
      --allowed-hosts "mlflow:5000,localhost:5001,127.0.0.1:5001"
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: solarpulse-dashboard:latest
    ports:
      - "8501:8501"
    environment:
      SOLARPULSE_STORAGE_BACKEND: s3
      S3_ENDPOINT: object-store:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-solarpulse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-solarpulse-secret}
    volumes:
      - .:/opt/solarpulse
    depends_on:
      object-store:
        condition: service_started
    restart: unless-stopped

volumes:
  lake_data:
  airflow_db:
  mlflow_data:
