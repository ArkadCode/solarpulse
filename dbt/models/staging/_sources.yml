version: 2

sources:
  - name: bronze
    description: Raw data written by the Python ingestion (src/ingestion) to the lake.
    tables:
      - name: raw_openmeteo
        description: >
          Hourly Open-Meteo responses as received, one Parquet file per location and year
          (hive partitions location_id=/year=), plus extraction metadata.
        meta:
          external_location: >-
            read_parquet('{{ env_var("SOLARPULSE_LAKE_ROOT") }}/bronze/raw_openmeteo/*/*/*.parquet',
            hive_partitioning = true)
        columns:
          - name: time
            description: Hour start in UTC, ISO 8601 text. Values are the mean of the previous hour.
          - name: extracted_at
            description: When the partition was downloaded.

      - name: ref_locations
        description: Every location configured in config/locations.yml.
        meta:
          external_location: "read_parquet('{{ env_var(\"SOLARPULSE_LAKE_ROOT\") }}/bronze/ref_locations/*.parquet')"
